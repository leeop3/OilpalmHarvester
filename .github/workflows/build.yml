- name: Setup Gradle Wrapper
  run: |
    # Create wrapper directory if missing
    mkdir -p gradle/wrapper
    
    # Download gradle-wrapper.jar if it doesn't exist
    if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
      echo "Downloading gradle-wrapper.jar..."
      curl -L -o gradle/wrapper/gradle-wrapper.jar \
        "https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar"
    fi
    
    # Ensure gradlew is executable
    chmod +x gradlew

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    # === ADD THIS STEP ===
    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar"
        fi
        chmod +x gradlew
    # === END ADD ===
    
    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon
      env:
        CHAQUOPY_PYTHON_VERSION: "3.8"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: oilpalm-harvester-debug
        path: app/build/outputs/apk/debug/app-debug.apk